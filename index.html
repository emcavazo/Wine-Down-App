<!DOCTYPE html>
<html>
<head>
    <title>Wine Down</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 40px; }
        input { width: 70%; padding: 8px; }
        button { padding: 8px 16px; }
        .result { border-bottom: 1px solid #cca9a9; padding: 12px 0; }
        .title {margin-top: 10 px; font-weight: bold; }
        .similarity { color: #8b1a1a; font-size: 0.9em; }
        .info-card {color:rgb(0, 0, 0); font-size: mediumS;background-color: antiquewhite;}
        .alltags {margin: 4px; border:2px solid rgb(34, 12, 54); margin: 6px 0;}
        .c_alltags{margin: 4px; border:2px solid rgb(34, 12, 54); margin: 6px 0;}
        
    </style>
</head>
<body>
    <h1>Wine Down</h1>
    <input type="text" id="wineInput" placeholder="Search for a wine title..." oninput = "showSuggestions()">

    <div id="suggestions"></div>
    <div id="infoCard"></div>
    <div id="results"></div>
    
    

    <script>
       let debounceTimer;

    function showSuggestions() {
        clearTimeout(debounceTimer) // typing delay

        debounceTimer = setTimeout(async () => {
            const query = document.getElementById("wineInput").value;
            const suggestionsDiv = document.getElementById("suggestions");

            if (!query) { //if they arent typing
                suggestionsDiv.innerHTML = "";
                return;
            }

            const response = await fetch(`/search?q=${encodeURIComponent(query)}`);
            const data = await response.json();

            window.currentMatches = data.results;

            suggestionsDiv.innerHTML = data.results.map(wine => `
                <div class="suggestion" onclick="selectWine('${wine.title.replace(/'/g, "\\'")}')">${wine.title}</div>
            `).join("");
        }, 300);
    }

    function selectWine(title) {
        document.getElementById("wineInput").value = title;
        document.getElementById("suggestions").innerHTML = "";
        search(title);
        const currWine = window.currentMatches.find(w => w.title === title);
        const infoCard = document.getElementById("infoCard");
        if (currWine) {
            infoCard.innerHTML = `
                <div class = "info-card">
                    <div class = "title">You chose: ${currWine.title} </div>
                    <div>${currWine.variety}</div>
                    <div>Flavor Profile: ${currWine.flavor_tags}</div>
                    <div>${currWine.description}</div>
                    <div class="c_alltags">
                        <div>Tannin: ${currWine.tannin_level} | Acidity: ${currWine.acidity_level} | Body: ${currWine.body_level} | Sweet: ${currWine.sweetness_level} | Flavor Profile: ${currWine.flavor_tags}</div>
                    </div>    
                </div>
            `;

    
        }

        search(title);
    }

    async function search(titleOverride) {
        const wineTitle = titleOverride || document.getElementById("wineInput").value;
        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML = "Searching...";

        const response = await fetch(`/recommend?wine=${encodeURIComponent(wineTitle)}`);
        const data = await response.json();

        if (data.error) {
            resultsDiv.innerHTML = `<p>${data.error}</p>`;
            return;
        }
        

        resultsDiv.innerHTML = data.results.map(wine => `
            <div class="result">
                <div class="title">${wine.title}</div>
                <div class="similarity">${wine.variety} — ${wine.similarity.toFixed(1)}% similar</div>
                <div>${wine.description}</div>
                <div class="alltags">
                    <div>Tannin: ${wine.tannin_level} | Acidity: ${wine.acidity_level} | Body: ${wine.body_level} | Sweet: ${wine.sweetness_level} | Flavor Profile: ${wine.flavor_tags}</div>
                </div>
            </div>
        `).join("");
    }
    </script>
</body>
</html>
